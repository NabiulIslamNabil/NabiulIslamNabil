<svg width="100%" viewBox="0 0 680 200" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Terminal Animation</title>
  <desc>A dark terminal window that types out Nabiul's personal dev mantra line by line</desc>

  <rect x="0" y="0" width="680" height="200" rx="10" fill="#0d0d0d"/>
  <rect x="0" y="0" width="680" height="32" rx="10" fill="#1a1a2e"/>
  <rect x="0" y="20" width="680" height="12" fill="#1a1a2e"/>

  <circle cx="22" cy="16" r="6" fill="#e94560"/>
  <circle cx="44" cy="16" r="6" fill="#f5a623"/>
  <circle cx="66" cy="16" r="6" fill="#a8edea"/>

  <text x="340" y="20" text-anchor="middle" fill="#888" font-family="monospace" font-size="12">nabiul@nabil ~ terminal</text>

  <text x="24" y="64" font-family="monospace" font-size="13" fill="#a8edea">
    <tspan>$ </tspan><tspan fill="#ffffff">whoami</tspan>
  </text>
  <text x="24" y="84" font-family="monospace" font-size="13" fill="#e94560">
    S.M. Nabiul Islam — Builder · Mentor · Researcher
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.05;0.15;1" dur="6s" repeatCount="indefinite"/>
  </text>

  <text x="24" y="110" font-family="monospace" font-size="13" fill="#a8edea">
    <tspan>$ </tspan><tspan fill="#ffffff">cat projects.txt</tspan>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.25;0.35;1" dur="6s" repeatCount="indefinite"/>
  </text>
  <text x="24" y="130" font-family="monospace" font-size="13" fill="#f5a623">
    ResQ  ·  ARAM  ·  FarmFriend  ·  EasyNeeds  ·  FinVision AI
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4;0.52;1" dur="6s" repeatCount="indefinite"/>
  </text>

  <text x="24" y="156" font-family="monospace" font-size="13" fill="#a8edea">
    <tspan>$ </tspan><tspan fill="#ffffff">echo $mission</tspan>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6;0.7;1" dur="6s" repeatCount="indefinite"/>
  </text>
  <text x="24" y="176" font-family="monospace" font-size="13" fill="#ffffff">
    I don't just study CS, I teach it, build it, and live it.
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.75;0.85;1" dur="6s" repeatCount="indefinite"/>
  </text>

  <text x="24" y="176" font-family="monospace" font-size="13" fill="#e94560">
    <tspan>▋</tspan>
    <animate attributeName="opacity" values="1;0;1;0;1" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="x" values="24;490;24" keyTimes="0;0.85;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="y" values="64;64;84;84;110;110;130;130;156;156;176;176" keyTimes="0;0.04;0.05;0.14;0.25;0.34;0.4;0.51;0.6;0.69;0.75;1" dur="6s" repeatCount="indefinite"/>
  </text>
</svg>